name: Benchmark checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: circuit_bench/adapters/pi/package-lock.json
      - run: npm ci --prefix circuit_bench/adapters/pi --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover -s tests -v
        env:
          PI_TEST_CLI: ${{ github.workspace }}/circuit_bench/adapters/pi/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
      - run: python -m compileall -q circuit_bench
